#
# recipe.yaml
# mosaic
#
# Created by Christian Bator on 03/11/2025
#
# Usage: rattler-build build --recipe rattler-build/recipe.yaml -c https://conda.modular.com/max -c conda-forge
#

context:
  version: "0.3.0"

  # Mojo's minimum system versions (https://mojolang.org/docs/requirements), which should match pixi.toml > platforms
  macos: "15.0"
  glibc: "2.34"

package:
  name: mosaic-mojo
  version: ${{ version }}

source:
  - path: ..

build:
  number: 0
  script: build/build.sh
  dynamic_linking:
    missing_dso_allowlist:
      - if: osx
        then:
          - /usr/lib/swift/libswift*.dylib
requirements:
  build:
    - clangxx>=22.1.0,<23.0
    - mojo-compiler>=1.0,<2.0
    - max-core>=26.7.0,<27
  host:
    - mojo-compiler>=1.0,<2.0
    - max-core>=26.7.0,<27
    - if: osx
      then:
        - libcxx
  run:
    - ${{ pin_compatible('mojo-compiler') }}
    - ${{ pin_compatible('max-core') }}
    - if: osx
      then:
        - ${{ pin_compatible('libcxx') }}
  run_constraints:
    - if: osx
      then:
        - __osx >=${{ macos }}
    - if: linux
      then:
        - __glibc >=${{ glibc }}

tests:
  - script:
      env:
        # rattler-build defaults to 11.0, and Mojo links its Metal kernels for this target, which fails below macOS 15
        MACOSX_DEPLOYMENT_TARGET: ${{ macos }}
      content: |
        for test_file in tests/test_*.mojo; do
          mojo run ${test_file} || exit 1
        done
    requirements:
      run:
        - mojo-compiler>=1.0,<2.0
        - max-core>=26.7.0,<27
    files:
      source:
        - tests/**.mojo
        - tests/data/

about:
  homepage: https://github.com/christianbator/mosaic
  license: Apache-2.0
  license_file: LICENSE
  summary: An image processing library in Mojo
  repository: https://github.com/christianbator/mosaic
  documentation: https://christianbator.github.io/mosaic

extra:
  project_name: Mosaic
  maintainers:
    - christianbator
